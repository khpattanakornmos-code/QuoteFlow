<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ค่าแรง – QuoteFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.worker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.worker-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-xs);transition:all var(--t);}
.worker-card:hover{box-shadow:var(--shadow-md);border-color:var(--blue-light);}
.w-avatar{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.f-tab{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;transition:all var(--t);font-family:var(--font);}
.f-tab.active{background:var(--blue-grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-sm);}
</style>
</head>
<body>
<div class="app-layout">
  <div id="nav-root"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="flex-center gap-12">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="page-title">👷 ค่าแรง & เช็คยอดหนี้</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="loadPayroll()">🔄</button>
        <button class="btn btn-primary" onclick="QuoteFlow.openModal('payModal')">+ เพิ่มรายการ</button>
      </div>
    </div>
    <div class="page-body">
      <div class="grid grid-4 mb-24">
        <div class="card stat-card amber"><div class="stat-icon">⏳</div><div class="stat-value" id="st-pending">฿0</div><div class="stat-label">รอจ่ายทั้งหมด</div></div>
        <div class="card stat-card blue"><div class="stat-icon">👷</div><div class="stat-value" id="st-int">฿0</div><div class="stat-label">พนักงานใน</div></div>
        <div class="card stat-card teal"><div class="stat-icon">🔧</div><div class="stat-value" id="st-ext">฿0</div><div class="stat-label">ช่างนอก</div></div>
        <div class="card stat-card green"><div class="stat-icon">✅</div><div class="stat-value" id="st-paid">฿0</div><div class="stat-label">จ่ายแล้วรวม</div></div>
      </div>
      <div class="card mb-20" style="padding:12px 16px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="f-tab active" data-f="all">ทั้งหมด</button>
          <button class="f-tab" data-f="พนักงาน">👷 พนักงานใน</button>
          <button class="f-tab" data-f="ช่างนอก">🔧 ช่างนอก</button>
          <button class="f-tab" data-f="Pending">⏳ รอจ่าย</button>
          <button class="f-tab" data-f="Paid">✅ จ่ายแล้ว</button>
        </div>
      </div>
      <div class="worker-grid" id="workerGrid"></div>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="payModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">👷 เพิ่มรายการค่าแรง</div>
      <button class="modal-close" onclick="QuoteFlow.closeModal('payModal')">✕</button>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <button class="btn btn-primary" id="wt-int" onclick="setWT('พนักงาน')" style="flex:1;justify-content:center;">👷 พนักงานใน</button>
      <button class="btn btn-outline" id="wt-ext" onclick="setWT('ช่างนอก')"  style="flex:1;justify-content:center;">🔧 ช่างนอก</button>
    </div>
    <input type="hidden" id="workerType" value="พนักงาน">
    <div class="form-group mb-12">
      <label class="form-label">ชื่อผู้รับเงิน *</label>
      <input class="form-input" id="workerName" placeholder="ชื่อพนักงาน / ช่าง">
    </div>
    <div class="form-group mb-12">
      <label class="form-label">ยอดเงิน (บาท) *</label>
      <input type="number" class="form-input" id="payAmount" placeholder="0.00" min="0" style="font-size:18px;font-weight:600;">
    </div>
    <div class="form-group mb-12">
      <label class="form-label">รายละเอียดงาน</label>
      <input class="form-input" id="payDesc" placeholder="งานที่ทำ...">
    </div>
    <div class="form-group mb-20">
      <label class="form-label">กำหนดจ่าย</label>
      <input type="date" class="form-input" id="payDue">
    </div>
    <div class="flex-center gap-10" style="justify-content:flex-end;">
      <button class="btn btn-outline" onclick="QuoteFlow.closeModal('payModal')">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSavePay" onclick="savePay()">💾 บันทึก</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/nav.js"></script>
<script>
QuoteFlow.requireAuth();
injectSidebar('payroll');

var payData = [];
var filterMode = 'all';
var _saving = false;

function setWT(t){
  document.getElementById('workerType').value = t;
  document.getElementById('wt-int').className='btn '+(t==='พนักงาน'?'btn-primary':'btn-outline')+' ';
  document.getElementById('wt-int').style='flex:1;justify-content:center;';
  document.getElementById('wt-ext').className='btn '+(t==='ช่างนอก'?'btn-primary':'btn-outline')+' ';
  document.getElementById('wt-ext').style='flex:1;justify-content:center;';
}

function loadPayroll(){
  QuoteFlow.api('getPayroll').then(function(res){
    if(!res.success)return;
    payData=res.data||[];
    var pending = payData.filter(function(r){return r.status==='Pending';}).reduce(function(s,r){return s+Number(r.amount||0);},0);
    var intAmt  = payData.filter(function(r){return r.workerType==='พนักงาน';}).reduce(function(s,r){return s+Number(r.amount||0);},0);
    var extAmt  = payData.filter(function(r){return r.workerType==='ช่างนอก';}).reduce(function(s,r){return s+Number(r.amount||0);},0);
    var paid    = payData.filter(function(r){return r.status==='Paid';}).reduce(function(s,r){return s+Number(r.amount||0);},0);
    document.getElementById('st-pending').textContent = QuoteFlow.baht(pending);
    document.getElementById('st-int').textContent     = QuoteFlow.baht(intAmt);
    document.getElementById('st-ext').textContent     = QuoteFlow.baht(extAmt);
    document.getElementById('st-paid').textContent    = QuoteFlow.baht(paid);
    renderCards();
  });
}

function renderCards(){
  var list = payData;
  if(filterMode==='พนักงาน') list=list.filter(function(r){return r.workerType==='พนักงาน';});
  else if(filterMode==='ช่างนอก') list=list.filter(function(r){return r.workerType==='ช่างนอก';});
  else if(filterMode==='Pending')  list=list.filter(function(r){return r.status==='Pending';});
  else if(filterMode==='Paid')     list=list.filter(function(r){return r.status==='Paid';});

  var el = document.getElementById('workerGrid');
  if(!list.length){el.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">👷</div><p>ยังไม่มีรายการ</p></div>';return;}
  var today = new Date();
  el.innerHTML = list.map(function(r){
    var isInt = r.workerType==='พนักงาน';
    var init  = (r.workerName||'?')[0].toUpperCase();
    var overdue = r.status==='Pending'&&r.dueDate&&new Date(r.dueDate)<today;
    return '<div class="worker-card">'+
      '<div class="flex-between mb-12">'+
        '<div class="flex-center gap-10">'+
          '<div class="w-avatar" style="background:'+(isInt?'linear-gradient(135deg,#3b82f6,#60a5fa)':'linear-gradient(135deg,#10b981,#34d399)')+'">'+init+'</div>'+
          '<div>'+
            '<div style="font-weight:600;font-size:14px;">'+( r.workerName||'-')+'</div>'+
            '<span class="badge '+(isInt?'badge-active':'badge-pending')+'">'+(isInt?'👷 พนักงาน':'🔧 ช่างนอก')+'</span>'+
          '</div>'+
        '</div>'+
        '<span class="badge '+(r.status==='Paid'?'badge-paid':'badge-pending')+'">'+(r.status==='Paid'?'✅ จ่ายแล้ว':'⏳ รอจ่าย')+'</span>'+
      '</div>'+
      '<div style="font-size:22px;font-weight:700;color:var(--blue);margin-bottom:6px;">'+QuoteFlow.baht(r.amount)+'</div>'+
      '<div style="font-size:12px;color:var(--text3);margin-bottom:10px;">'+(r.description||'–')+'</div>'+
      '<div class="flex-between">'+
        '<span style="font-size:11px;color:'+(overdue?'var(--red)':'var(--text3)')+';">'+(r.dueDate?'📅 '+QuoteFlow.fmtDate(r.dueDate):'')+'</span>'+
        (r.status==='Pending'?'<button class="btn btn-green btn-sm" onclick="markPaid(\''+r.id+'\')">✅ จ่ายแล้ว</button>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

function savePay(){
  if(_saving)return;
  var wn=document.getElementById('workerName').value.trim();
  var am=Number(document.getElementById('payAmount').value);
  if(!wn){QuoteFlow.toast('กรุณาใส่ชื่อผู้รับ','error');return;}
  if(!am||am<=0){QuoteFlow.toast('กรุณาใส่ยอดเงิน','error');return;}
  _saving=true; document.getElementById('btnSavePay').disabled=true;
  QuoteFlow.api('addPayroll',{
    workerName:wn, workerType:document.getElementById('workerType').value,
    amount:am, description:document.getElementById('payDesc').value.trim(),
    dueDate:document.getElementById('payDue').value, status:'Pending',
  }).then(function(res){
    _saving=false; document.getElementById('btnSavePay').disabled=false;
    if(res.success){
      QuoteFlow.toast('บันทึกสำเร็จ! ✅','success');
      QuoteFlow.closeModal('payModal');
      document.getElementById('workerName').value='';
      document.getElementById('payAmount').value='';
      document.getElementById('payDesc').value='';
      loadPayroll();
    }
  });
}

function markPaid(id){
  QuoteFlow.api('updatePayroll',{id:id,status:'Paid'}).then(function(r){
    if(r.success){QuoteFlow.toast('บันทึกการจ่ายแล้ว ✅','success');loadPayroll();}
  });
}

document.querySelectorAll('.f-tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.f-tab').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active'); filterMode=btn.dataset.f; renderCards();
  });
});

loadPayroll();
</script>
</body>
</html>
