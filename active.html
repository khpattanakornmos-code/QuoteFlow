<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Active Orders – QuoteFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.order-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all var(--t);box-shadow:var(--shadow-xs);position:relative;}
.order-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#10b981,#34d399);border-radius:var(--radius) var(--radius) 0 0;}
.order-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#86efac;}
.step-pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;border:1.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;transition:all var(--t);font-family:var(--font);}
.step-pill:hover{border-color:var(--blue);color:var(--blue);}
.step-pill.done{background:#d1fae5;color:#065f46;border-color:#a7f3d0;}
.st-pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;transition:all var(--t);font-family:var(--font);}
.st-pill.active{background:var(--blue-grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-sm);}
</style>
</head>
<body>
<div class="app-layout">
  <div id="nav-root"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="flex-center gap-12">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="page-title">⚡ Active Orders</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="loadOrders()">🔄 โหลดใหม่</button>
      </div>
    </div>
    <div class="page-body">
      <div class="grid grid-4 mb-24">
        <div class="card stat-card teal"><div class="stat-icon">⚡</div><div class="stat-value" id="st-total">0</div><div class="stat-label">Orders ทั้งหมด</div></div>
        <div class="card stat-card blue"><div class="stat-icon">🔧</div><div class="stat-value" id="st-inprog">0</div><div class="stat-label">กำลังผลิต</div></div>
        <div class="card stat-card amber"><div class="stat-icon">🔍</div><div class="stat-value" id="st-qc">0</div><div class="stat-label">QC / ตรวจสอบ</div></div>
        <div class="card stat-card green"><div class="stat-icon">✅</div><div class="stat-value" id="st-done">0</div><div class="stat-label">พร้อมส่ง / เสร็จ</div></div>
      </div>
      <div id="orderGrid" class="order-grid"></div>
    </div>
  </div>
</div>

<!-- Timeline Modal -->
<div class="modal-overlay" id="tlModal">
  <div class="modal modal-md">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="tlTitle">Timeline การผลิต</div>
        <div class="text-sm text-muted" id="tlSub"></div>
      </div>
      <button class="modal-close" onclick="QuoteFlow.closeModal('tlModal')">✕</button>
    </div>

    <!-- Timeline display -->
    <div class="card-title mb-10">📍 ขั้นตอนที่ผ่านมา</div>
    <div class="timeline" id="tlDisplay"></div>
    <hr class="divider">

    <!-- ข้อมูลมัดจำ -->
    <div class="card mb-16" style="background:var(--blue-pale);border-color:var(--blue-light);">
      <div class="card-title mb-12" style="margin-bottom:12px;">💰 ข้อมูลมัดจำ</div>
      <div class="form-row form-row-3">
        <div class="form-group">
          <label class="form-label">% มัดจำ</label>
          <input type="number" class="form-input" id="depositPct" placeholder="40" min="0" max="100" step="0.01" oninput="syncDepositAmount()">
        </div>
        <div class="form-group">
          <label class="form-label">ยอดมัดจำ (บาท)</label>
          <input type="number" class="form-input" id="depositAmount" placeholder="0.00" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">สถานะมัดจำ</label>
          <select class="form-input" id="depositPaid">
            <option value="false">⏳ ยังไม่รับมัดจำ</option>
            <option value="true">✅ รับมัดจำแล้ว</option>
          </select>
        </div>
      </div>
    </div>

    <!-- เพิ่ม Step -->
    <div class="card-title mb-10">➕ เพิ่มขั้นตอน</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;" id="quickSteps"></div>
    <div class="form-group mb-12">
      <label class="form-label">หรือพิมพ์ขั้นตอนเอง</label>
      <input class="form-input" id="customStep" placeholder="เช่น ตัดผ้า, เย็บ, ส่งของ...">
    </div>

    <!-- สถานะ + กำหนดส่ง -->
    <div class="form-row form-row-2 mb-16">
      <div class="form-group">
        <label class="form-label">สถานะ Order</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;" id="statusPills"></div>
      </div>
      <div class="form-group">
        <label class="form-label">กำหนดส่งงาน</label>
        <input type="date" class="form-input" id="newDueDate">
      </div>
    </div>

    <div class="flex-center gap-10" style="justify-content:flex-end;">
      <button class="btn btn-outline" onclick="QuoteFlow.closeModal('tlModal')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveTimeline()">💾 บันทึก</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/nav.js"></script>
<script>
QuoteFlow.requireAuth();
injectSidebar('active');

var orders = [];
var currentOrder = null;
var selectedStatus = 'In Progress';
var STATUSES = ['In Progress','Quality Check','Ready','Delivered','Completed'];
var ALL_STEPS = ['รับงาน','เตรียมวัสดุ','กำลังผลิต','QC ตรวจสอบ','แพ็คสินค้า','จัดส่ง','เก็บเงิน'];
var STATUS_PCT = {'In Progress':35,'Quality Check':60,'Ready':80,'Delivered':95,'Completed':100};

function loadOrders() {
  QuoteFlow.api('getActiveOrders').then(function(res) {
    if(!res.success) return;
    orders = res.data||[];
    document.getElementById('st-total').textContent  = orders.length;
    document.getElementById('st-inprog').textContent = orders.filter(function(o){return o.status==='In Progress';}).length;
    document.getElementById('st-qc').textContent     = orders.filter(function(o){return o.status==='Quality Check';}).length;
    document.getElementById('st-done').textContent   = orders.filter(function(o){return ['Ready','Delivered','Completed'].indexOf(o.status)>=0;}).length;
    renderOrders();
  });
}

function renderOrders() {
  var el = document.getElementById('orderGrid');
  if(!orders.length){
    el.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚡</div><p>ยังไม่มี Active Order<br><span class="text-xs">ไปที่ใบเสนอราคา แล้วกด Activate</span></p></div>';
    return;
  }
  el.innerHTML = orders.map(function(o) {
    var tl   = Array.isArray(o.timeline)?o.timeline:[];
    var pct  = STATUS_PCT[o.status]||Math.min(tl.length*15,95);
    var done = tl.map(function(t){return t.step;});
    return '<div class="order-card" onclick="openTl(\''+o.quotationId+'\')">'+
      '<div class="flex-between mb-10">'+
        '<span style="font-size:11px;font-weight:600;color:var(--text3);">'+o.quotationId+'</span>'+
        '<span class="badge badge-active">'+( o.status||'In Progress')+'</span>'+
      '</div>'+
      '<div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px;">'+(o.customerName||'-')+'</div>'+
      '<div style="font-size:12px;color:var(--text3);margin-bottom:10px;">💰 '+QuoteFlow.baht(o.total)+
        (o.depositAmount>0?' &nbsp;|&nbsp; มัดจำ '+(o.depositPct?Number(o.depositPct).toLocaleString('th-TH')+'% ':'')+QuoteFlow.baht(o.depositAmount)+((o.depositPaid===true||o.depositPaid==='true')?' ✅':''):'')+'</div>'+
      '<div style="font-size:12px;color:var(--text3);margin-bottom:12px;">📅 กำหนดส่ง: '+(o.dueDate?QuoteFlow.fmtDate(o.dueDate):'-')+'</div>'+
      '<div class="progress-bar mb-4"><div class="progress-fill" style="width:'+pct+'%;background:linear-gradient(90deg,#3b82f6,#10b981);"></div></div>'+
      '<div style="font-size:11px;color:var(--text3);margin-bottom:10px;">'+tl.length+' ขั้นตอน / '+pct+'%</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:4px;">'+
        ALL_STEPS.map(function(s){var d=done.indexOf(s)>=0;return'<span class="step-pill'+(d?' done':'')+'">'+( d?'✓ ':'')+s+'</span>';}).join('')+
      '</div>'+
    '</div>';
  }).join('');
}

function openTl(qId) {
  currentOrder = null;
  for(var i=0;i<orders.length;i++){if(orders[i].quotationId===qId){currentOrder=orders[i];break;}}
  if(!currentOrder) return;
  var o = currentOrder;
  var tl = Array.isArray(o.timeline)?o.timeline:[];

  document.getElementById('tlTitle').textContent = '⚡ '+o.customerName;
  document.getElementById('tlSub').textContent   = o.quotationId+' · '+QuoteFlow.baht(o.total);

  // Timeline
  document.getElementById('tlDisplay').innerHTML = tl.length
    ? tl.map(function(t,i){
        return '<div class="timeline-item">'+
          '<div class="timeline-dot '+(i===tl.length-1?'active':'done')+'"></div>'+
          '<div class="timeline-label">'+t.step+'</div>'+
          '<div class="timeline-date">'+QuoteFlow.fmtDate(t.date)+'</div>'+
        '</div>';
      }).join('')
    : '<div class="text-muted text-sm">ยังไม่มีขั้นตอน</div>';

  // Quick steps
  var done2 = tl.map(function(t){return t.step;});
  document.getElementById('quickSteps').innerHTML = ALL_STEPS.map(function(s){
    var d = done2.indexOf(s)>=0;
    return '<button class="step-pill'+(d?' done':'')+'" onclick="pickStep(\''+s+'\')" '+(d?'disabled':'')+'>'+( d?'✓ ':'')+s+'</button>';
  }).join('');

  // Deposit
  document.getElementById('depositPct').value    = o.depositPct||40;
  document.getElementById('depositAmount').value = o.depositAmount||'';
  document.getElementById('depositPaid').value   = o.depositPaid===true||o.depositPaid==='true'?'true':'false';

  // Status
  selectedStatus = o.status||'In Progress';
  document.getElementById('statusPills').innerHTML = STATUSES.map(function(s){
    return '<button class="st-pill'+(s===selectedStatus?' active':'')+'" onclick="pickStatus(this,\''+s+'\')">'+s+'</button>';
  }).join('');

  document.getElementById('newDueDate').value = o.dueDate?(String(o.dueDate).substring(0,10)):'';
  document.getElementById('customStep').value = '';
  QuoteFlow.openModal('tlModal');
  QuoteFlow.applyPermissions();
}

function pickStep(s){document.getElementById('customStep').value=s;}
function syncDepositAmount(){
  if(!currentOrder)return;
  var pct=Number(document.getElementById('depositPct').value)||0;
  document.getElementById('depositAmount').value=Math.round((Number(currentOrder.total)||0)*pct/100);
}
function pickStatus(btn,s){
  selectedStatus=s;
  document.querySelectorAll('.st-pill').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
}

function saveTimeline() {
  if(!currentOrder) return;
  var step          = document.getElementById('customStep').value.trim();
  var dueDate       = document.getElementById('newDueDate').value;
  var depositPct    = Number(document.getElementById('depositPct').value)||0;
  var depositAmount = Number(document.getElementById('depositAmount').value)||0;
  var depositPaid   = document.getElementById('depositPaid').value;

  var data = {
    quotationId  : currentOrder.quotationId,
    status       : selectedStatus,
    dueDate      : dueDate,
    depositPct   : depositPct,
    depositAmount: depositAmount,
    depositPaid  : depositPaid==='true',
  };
  if(step) data.newStep = step;

  QuoteFlow.api('updateOrderStatus', data).then(function(res) {
    if(res.success){
      QuoteFlow.toast('อัปเดตสำเร็จ! ✅','success');
      QuoteFlow.closeModal('tlModal');
      loadOrders();
    } else {
      QuoteFlow.toast('เกิดข้อผิดพลาด','error');
    }
  });
}

loadOrders();
</script>
</body>
</html>
