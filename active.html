<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Orders – QuoteFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.order-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap:16px; }

.order-card {
  background:#fff; border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
  cursor:pointer; transition:all var(--t);
  box-shadow:var(--shadow-xs); position:relative; overflow:hidden;
}
.order-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg,#10b981,#34d399);
}
.order-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#86efac; }

.order-status-badge {
  padding:4px 14px; border-radius:20px; font-size:12px; font-weight:600;
  display:inline-flex; align-items:center; gap:5px;
}
.os-progress  { background:#dbeafe; color:#1e40af; }
.os-qc        { background:#fef3c7; color:#92400e; }
.os-ready     { background:#d1fae5; color:#065f46; }
.os-delivered { background:#ede9fe; color:#5b21b6; }
.os-completed { background:#d1fae5; color:#065f46; }

.progress-wrap { margin:14px 0 6px; }
.prog-info { display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-bottom:4px; }

.tl-steps { display:flex; gap:4px; flex-wrap:wrap; margin-top:12px; }
.tl-step {
  padding:3px 10px; border-radius:12px; font-size:11px; font-weight:500;
  background:var(--border2); color:var(--text3); border:1px solid var(--border);
}
.tl-step.done { background:#d1fae5; color:#065f46; border-color:#a7f3d0; }
.tl-step.cur  { background:var(--blue-pale); color:var(--blue-dark); border-color:var(--blue-light); }

/* Timeline modal */
.tl-modal-wrap { display:flex; flex-direction:column; gap:0; }
.tl-modal-item {
  display:flex; gap:14px; padding-bottom:18px; position:relative;
}
.tl-modal-item:last-child { padding-bottom:0; }
.tl-col { display:flex; flex-direction:column; align-items:center; width:16px; }
.tl-dot-lg {
  width:14px; height:14px; border-radius:50%;
  background:var(--text3); border:2px solid #fff;
  box-shadow:0 0 0 3px var(--border2); flex-shrink:0; margin-top:2px;
}
.tl-dot-lg.done   { background:var(--green); box-shadow:0 0 0 4px rgba(16,185,129,.15); }
.tl-dot-lg.active { background:var(--blue);  box-shadow:0 0 0 4px rgba(59,130,246,.18); }
.tl-vline { flex:1; width:2px; background:linear-gradient(to bottom,var(--blue-pale),transparent); margin-top:4px; min-height:30px; }
.tl-modal-item:last-child .tl-vline { display:none; }
.tl-label { font-size:14px; font-weight:600; color:var(--text); }
.tl-date  { font-size:11px; color:var(--text3); margin-top:2px; }

/* Quick step pills */
.step-picker { display:flex; flex-wrap:wrap; gap:6px; }
.step-pill {
  padding:5px 14px; border-radius:20px; font-size:12px; font-weight:500;
  border:1.5px solid var(--border); background:#fff; color:var(--text2);
  cursor:pointer; transition:all var(--t); font-family:var(--font);
}
.step-pill:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-pale); }
.step-pill.done  { background:#d1fae5; color:#065f46; border-color:#a7f3d0; border-style:solid; }

/* Status selector */
.status-pills { display:flex; flex-wrap:wrap; gap:6px; }
.st-pill {
  padding:6px 16px; border-radius:20px; font-size:12px; font-weight:500;
  border:1.5px solid var(--border); background:#fff; color:var(--text2);
  cursor:pointer; transition:all var(--t); font-family:var(--font);
}
.st-pill:hover  { border-color:var(--blue); background:var(--blue-pale); color:var(--blue); }
.st-pill.active { background:var(--blue-grad); color:#fff; border-color:transparent; box-shadow:var(--shadow-sm); }
</style>
</head>
<body>
<div class="app-layout">
  <div id="nav-root"></div>
  <div class="main-content">

    <div class="topbar">
      <div class="flex-center gap-12">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="page-title">⚡ Active Orders</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="loadOrders()">🔄 รีเฟรช</button>
        <a href="quotation.html" class="btn btn-ghost btn-sm">+ สร้างใบ QT</a>
      </div>
    </div>

    <div class="page-body">

      <!-- Summary stats -->
      <div class="grid grid-4 mb-24">
        <div class="card stat-card teal"><div class="stat-icon">⚡</div><div class="stat-value" id="st-total">0</div><div class="stat-label">Active Orders ทั้งหมด</div></div>
        <div class="card stat-card blue"><div class="stat-icon">🔧</div><div class="stat-value" id="st-inprog">0</div><div class="stat-label">กำลังผลิต</div></div>
        <div class="card stat-card amber"><div class="stat-icon">🔍</div><div class="stat-value" id="st-qc">0</div><div class="stat-label">QC / ตรวจสอบ</div></div>
        <div class="card stat-card green"><div class="stat-icon">✅</div><div class="stat-value" id="st-ready">0</div><div class="stat-label">พร้อมส่ง / เสร็จ</div></div>
      </div>

      <!-- Order cards -->
      <div id="orderGrid" class="order-grid"></div>

    </div>
  </div>
</div>

<!-- ═══ TIMELINE MODAL ════════════════════════════════════ -->
<div class="modal-overlay" id="tlModal">
  <div class="modal modal-md">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="tlTitle">Timeline การผลิต</div>
        <div class="text-sm text-muted" id="tlSubtitle"></div>
      </div>
      <button class="modal-close" onclick="QuoteFlow.QuoteFlow.closeModal('tlModal')">✕</button>
    </div>

    <!-- Current timeline -->
    <div class="card-title mb-12">📍 ขั้นตอนที่ผ่านมา</div>
    <div class="tl-modal-wrap" id="tlDisplay"></div>

    <hr class="divider">

    <!-- Quick add step -->
    <div class="card-title mb-10">➕ เพิ่มขั้นตอน</div>
    <div class="step-picker mb-16" id="quickSteps"></div>

    <div class="form-group mb-16">
      <label class="form-label">หรือพิมพ์ขั้นตอนเอง</label>
      <input class="form-input" id="customStep" placeholder="เช่น ส่งของ, ติดตั้ง, เก็บเงิน...">
    </div>

    <!-- Status + Due date -->
    <div class="form-row form-row-2 mb-16">
      <div class="form-group">
        <label class="form-label">สถานะ Order</label>
        <div class="status-pills" id="statusPills"></div>
      </div>
      <div class="form-group">
        <label class="form-label">กำหนดส่งงาน</label>
        <input type="date" class="form-input" id="newDueDate">
      </div>
    </div>

    <div class="flex-center gap-10" style="justify-content:flex-end;">
      <button class="btn btn-outline" onclick="QuoteFlow.QuoteFlow.closeModal('tlModal')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveTimeline()">💾 บันทึก Timeline</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/nav.js"></script>
<script>
QuoteFlow.requireAuth();
injectSidebar('active');

let orders = [];
let currentOrder = null;
let selectedStatus = 'In Progress';

const STATUSES = ['In Progress','Quality Check','Ready','Delivered','Completed'];
const ALL_STEPS = ['รับงาน','เตรียมวัสดุ','กำลังผลิต','ตัด/ตัดเย็บ','ประกอบ','QC ตรวจสอบ','แพ็คสินค้า','ส่งมอบ','เก็บเงิน'];
const STATUS_PROGRESS = { 'In Progress':35,'Quality Check':65,'Ready':80,'Delivered':95,'Completed':100 };
const STATUS_CLASS     = { 'In Progress':'os-progress','Quality Check':'os-qc','Ready':'os-ready','Delivered':'os-delivered','Completed':'os-completed' };

async function loadOrders() {
  const res = await QuoteFlow.api('getActiveOrders');
  if (!res.success) return;
  orders = res.data;
  // Stats
  document.getElementById('st-total').textContent  = orders.length;
  document.getElementById('st-inprog').textContent = orders.filter(o => o.status === 'In Progress').length;
  document.getElementById('st-qc').textContent     = orders.filter(o => o.status === 'Quality Check').length;
  document.getElementById('st-ready').textContent  = orders.filter(o => ['Ready','Delivered','Completed'].includes(o.status)).length;
  renderOrders();
}

function renderOrders() {
  const el = document.getElementById('orderGrid');
  if (!orders.length) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">⚡</div>
      <p>ยังไม่มี Active Order<br><span class="text-xs">ไปที่ใบเสนอราคา แล้วกด "Activate" เพื่อเริ่มงาน</span></p>
      <a href="quotation.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex;">📋 ไปที่ใบเสนอราคา</a>
    </div>`;
    return;
  }
  el.innerHTML = orders.map(o => {
    const tl = Array.isArray(o.timeline) ? o.timeline : [];
    const pct  = STATUS_PROGRESS[o.status] || Math.min(tl.length * 15, 95);
    const sc   = STATUS_CLASS[o.status] || 'os-progress';
    const doneSteps = tl.map(t => t.step);
    return `
    <div class="order-card" onclick="openTl('${o.quotationId}')">
      <div class="flex-between mb-10">
        <span style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.5px;">${o.quotationId}</span>
        <span class="order-status-badge ${sc}">${o.status||'In Progress'}</span>
      </div>
      <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px;">${o.customerName||'-'}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px;">
        💰 ${QuoteFlow.baht(o.total)} &nbsp;|&nbsp; 📅 กำหนดส่ง: ${o.dueDate ? QuoteFlow.fmtDate(o.dueDate) : '-'}
      </div>

      <div class="progress-wrap">
        <div class="prog-info">
          <span>${tl.length} ขั้นตอนแล้ว</span>
          <span style="font-weight:600;color:${pct>=80?'var(--green)':'var(--blue)'};">${pct}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,#3b82f6,#10b981);"></div>
        </div>
      </div>

      <div class="tl-steps">
        ${ALL_STEPS.slice(0,5).map(s => {
          const done = doneSteps.includes(s);
          const cur  = tl.length>0 && tl[tl.length-1]?.step === s;
          return `<span class="tl-step ${done?'done':''} ${cur?'cur':''}">${done?'✓':''} ${s}</span>`;
        }).join('')}
        ${tl.length>5?`<span class="tl-step" style="background:var(--blue-pale);color:var(--blue);">+${tl.length-5}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function openTl(qId) {
  currentOrder = orders.find(o => o.quotationId === qId); if (!currentOrder) return;
  const o  = currentOrder;
  const tl = Array.isArray(o.timeline) ? o.timeline : [];

  document.getElementById('tlTitle').textContent    = `⚡ ${o.customerName}`;
  document.getElementById('tlSubtitle').textContent = `${o.quotationId} · ${QuoteFlow.baht(o.total)}`;

  // Timeline display
  const doneSteps = tl.map(t => t.step);
  document.getElementById('tlDisplay').innerHTML = tl.length
    ? tl.map((t, i) => `
      <div class="tl-modal-item">
        <div class="tl-col">
          <div class="tl-dot-lg ${i===tl.length-1?'active':'done'}"></div>
          <div class="tl-vline"></div>
        </div>
        <div>
          <div class="tl-label">${t.step}</div>
          <div class="tl-date">📅 ${QuoteFlow.fmtDate(t.date)}</div>
        </div>
      </div>`).join('')
    : '<div style="color:var(--text3);font-size:13px;padding:12px 0;">ยังไม่มีขั้นตอน</div>';

  // Quick step pills
  document.getElementById('quickSteps').innerHTML = ALL_STEPS.map(s => {
    const done = doneSteps.includes(s);
    return `<button class="step-pill ${done?'done':''}" onclick="pickStep('${s}')" ${done?'disabled':''}>${done?'✓ ':''} ${s}</button>`;
  }).join('');

  // Status pills
  selectedStatus = o.status || 'In Progress';
  document.getElementById('statusPills').innerHTML = STATUSES.map(s => `
    <button class="st-pill ${s===selectedStatus?'active':''}" onclick="pickStatus(this,'${s}')">${s}</button>`).join('');

  // Due date
  document.getElementById('newDueDate').value = o.dueDate ? o.dueDate.substring(0,10) : '';
  document.getElementById('customStep').value = '';
  QuoteFlow.openModal('tlModal');
}

function pickStep(step) {
  document.getElementById('customStep').value = step;
}
function pickStatus(btn, status) {
  selectedStatus = status;
  document.querySelectorAll('.st-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function saveTimeline() {
  if (!currentOrder) return;
  const step    = document.getElementById('customStep').value.trim();
  const dueDate = document.getElementById('newDueDate').value;
  const data    = { quotationId: currentOrder.quotationId, status: selectedStatus, dueDate };
  if (step) data.newStep = step;
  const res = await QuoteFlow.api('updateOrderStatus', data);
  if (res.success) {
    QuoteFlow.toast(`อัปเดต Timeline สำเร็จ! ${step?'เพิ่ม "'+step+'"':''}`, 'success');
    QuoteFlow.closeModal('tlModal');
    loadOrders();
  } else QuoteFlow.toast('เกิดข้อผิดพลาด', 'error');
}

loadOrders();
</script>
</body>
</html>
