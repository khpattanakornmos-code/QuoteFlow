<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>รายรับ-รายจ่าย – QuoteFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.type-toggle{display:flex;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--card-alt);}
.type-btn{flex:1;padding:11px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;background:none;color:var(--text2);transition:all var(--t);border:none;font-family:var(--font);}
.type-btn.income.active{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46;}
.type-btn.expense.active{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;}
.tx-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card-alt);border:1px solid var(--border2);border-radius:10px;transition:all var(--t);gap:12px;}
.tx-row:hover{background:var(--blue-pale);border-color:var(--border);}
.cat-pill{padding:5px 14px;border-radius:16px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;transition:all var(--t);font-family:var(--font);}
.cat-pill.active{background:var(--blue-grad);color:#fff;border-color:transparent;}
.month-nav button{width:32px;height:32px;border-radius:50%;background:var(--blue-pale);border:1.5px solid var(--border);color:var(--blue);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t);}
.month-nav button:hover{background:var(--blue);color:#fff;}
</style>
</head>
<body>
<div class="app-layout">
  <div id="nav-root"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="flex-center gap-12">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="page-title">💰 รายรับ-รายจ่าย</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="QuoteFlow.openModal('finModal')">+ บันทึกรายการ</button>
      </div>
    </div>
    <div class="page-body">

      <!-- Month nav -->
      <div class="card mb-20" style="padding:14px 20px;">
        <div class="flex-between" style="flex-wrap:wrap;gap:12px;">
          <div class="month-nav flex-center gap-10">
            <button onclick="changeMonth(-1)">‹</button>
            <span style="font-size:15px;font-weight:600;color:var(--text);min-width:140px;text-align:center;" id="monthLabel">-</span>
            <button onclick="changeMonth(1)">›</button>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="loadFinance()">🔄 โหลดใหม่</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-3 mb-24">
        <div class="card stat-card green"><div class="stat-icon">💚</div><div class="stat-value" id="sum-income">฿0.00</div><div class="stat-label">รายรับเดือนนี้</div></div>
        <div class="card stat-card red"><div class="stat-icon">❤️</div><div class="stat-value" id="sum-expense">฿0.00</div><div class="stat-label">รายจ่ายเดือนนี้</div></div>
        <div class="card stat-card blue" id="profitCard"><div class="stat-icon">📈</div><div class="stat-value" id="sum-profit">฿0.00</div><div class="stat-label">กำไรสุทธิ</div></div>
      </div>

      <!-- List -->
      <div class="card">
        <div class="flex-between mb-16">
          <div class="card-title" style="margin:0">รายการทั้งหมด</div>
          <div style="display:flex;gap:6px;">
            <button class="cat-pill active" data-cat="all">ทั้งหมด</button>
            <button class="cat-pill" data-cat="income">💚 รายรับ</button>
            <button class="cat-pill" data-cat="expense">❤️ รายจ่าย</button>
          </div>
        </div>
        <div id="txList" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>

    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="finModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">💰 บันทึกรายการ</div>
      <button class="modal-close" onclick="QuoteFlow.closeModal('finModal')">✕</button>
    </div>
    <div class="type-toggle mb-16">
      <button class="type-btn income active" id="typeIncome"  onclick="setType('income')">💚 รายรับ</button>
      <button class="type-btn expense"       id="typeExpense" onclick="setType('expense')">❤️ รายจ่าย</button>
    </div>
    <div class="form-group mb-12">
      <label class="form-label">หมวดหมู่</label>
      <select class="form-input" id="finCat">
        <option value="ค่าบริการ">ค่าบริการ</option>
        <option value="ขายสินค้า">ขายสินค้า</option>
        <option value="รายได้อื่นๆ">รายได้อื่นๆ</option>
        <option value="ค่าวัสดุ">ค่าวัสดุ</option>
        <option value="ค่าแรง">ค่าแรง</option>
        <option value="ค่าเช่า">ค่าเช่า</option>
        <option value="ค่าสาธารณูปโภค">ค่าสาธารณูปโภค</option>
        <option value="ค่าขนส่ง">ค่าขนส่ง</option>
        <option value="ค่าใช้จ่ายอื่นๆ">ค่าใช้จ่ายอื่นๆ</option>
      </select>
    </div>
    <div class="form-group mb-12">
      <label class="form-label">จำนวนเงิน (บาท) *</label>
      <input type="number" class="form-input" id="finAmount" placeholder="0.00" min="0" step="0.01" style="font-size:18px;font-weight:600;">
    </div>
    <div class="form-group mb-20">
      <label class="form-label">รายละเอียด</label>
      <input class="form-input" id="finDesc" placeholder="รายละเอียดเพิ่มเติม...">
    </div>
    <div class="flex-center gap-10" style="justify-content:flex-end;">
      <button class="btn btn-outline" onclick="QuoteFlow.closeModal('finModal')">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSaveFin" onclick="saveFin()">💾 บันทึก</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/nav.js"></script>
<script>
QuoteFlow.requireAuth();
injectSidebar('finance');

var finType   = 'income';
var finData   = [];
var catView   = 'all';
var _saving   = false;
var now       = new Date();
var viewMonth = now.getMonth()+1;
var viewYear  = now.getFullYear();
var MONTHS    = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function setType(t){
  finType=t;
  document.getElementById('typeIncome').className  ='type-btn income' +(t==='income'?' active':'');
  document.getElementById('typeExpense').className ='type-btn expense'+(t==='expense'?' active':'');
}
function changeMonth(d){
  viewMonth+=d;
  if(viewMonth>12){viewMonth=1;viewYear++;}
  if(viewMonth<1) {viewMonth=12;viewYear--;}
  loadFinance();
}

function loadFinance(){
  document.getElementById('monthLabel').textContent = MONTHS[viewMonth]+' '+( viewYear+543);
  QuoteFlow.api('getFinance',{month:viewMonth,year:viewYear}).then(function(res){
    if(!res.success)return;
    finData=res.data||[];
    var inc=finData.filter(function(r){return r.type==='income';}).reduce(function(s,r){return s+Number(r.amount||0);},0);
    var exp=finData.filter(function(r){return r.type==='expense';}).reduce(function(s,r){return s+Number(r.amount||0);},0);
    document.getElementById('sum-income').textContent  = QuoteFlow.baht(inc);
    document.getElementById('sum-expense').textContent = QuoteFlow.baht(exp);
    var prof = inc-exp;
    document.getElementById('sum-profit').textContent  = QuoteFlow.baht(prof);
    document.getElementById('profitCard').className    = 'card stat-card '+(prof>=0?'blue':'red');
    renderList();
  });
}

function renderList(){
  var list = finData;
  if(catView==='income')  list=list.filter(function(r){return r.type==='income';});
  if(catView==='expense') list=list.filter(function(r){return r.type==='expense';});
  list = list.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var el = document.getElementById('txList');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">💰</div><p>ยังไม่มีรายการในเดือนนี้</p></div>';return;}
  el.innerHTML = list.map(function(r){
    return '<div class="tx-row">'+
      '<div style="width:36px;height:36px;border-radius:10px;background:'+(r.type==='income'?'#d1fae5':'#fee2e2')+';display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">'+(r.type==='income'?'💚':'❤️')+'</div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-weight:600;font-size:13.5px;">'+( r.category||'-')+'</div>'+
        '<div style="font-size:12px;color:var(--text3);">'+(r.description||'–')+' · '+QuoteFlow.fmtDate(r.date)+'</div>'+
      '</div>'+
      '<div style="text-align:right;flex-shrink:0;">'+
        '<div style="font-size:15px;font-weight:700;color:'+(r.type==='income'?'var(--green)':'var(--red)')+';">'+(r.type==='income'?'+':'-')+QuoteFlow.baht(r.amount)+'</div>'+
      '</div>'+
      '<button class="btn btn-danger btn-icon btn-sm" onclick="delFin(\''+r.id+'\')">🗑️</button>'+
    '</div>';
  }).join('');
}

function saveFin(){
  if(_saving)return;
  var amount = Number(document.getElementById('finAmount').value);
  if(!amount||amount<=0){QuoteFlow.toast('กรุณาใส่จำนวนเงิน','error');return;}
  _saving=true;
  document.getElementById('btnSaveFin').disabled=true;
  QuoteFlow.api('addFinance',{
    type:finType, category:document.getElementById('finCat').value,
    amount:amount, description:document.getElementById('finDesc').value.trim(),
  }).then(function(res){
    _saving=false; document.getElementById('btnSaveFin').disabled=false;
    if(res.success){
      QuoteFlow.toast('บันทึกสำเร็จ! ✅','success');
      QuoteFlow.closeModal('finModal');
      document.getElementById('finAmount').value='';
      document.getElementById('finDesc').value='';
      setTimeout(loadFinance, 2800);
    }
  });
}

function delFin(id){
  if(!confirm('ลบรายการนี้?'))return;
  QuoteFlow.api('deleteFinance',{id:id}).then(function(r){
    if(r.success){QuoteFlow.toast('ลบแล้ว','warn');setTimeout(loadFinance,2800);}
  });
}

document.querySelectorAll('.cat-pill').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.cat-pill').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active'); catView=btn.dataset.cat; renderList();
  });
});

loadFinance();
</script>
</body>
</html>
