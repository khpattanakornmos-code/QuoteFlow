<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ใบเสนอราคา – QuoteFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

<style>
.qt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
.qt-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all var(--t);box-shadow:var(--shadow-xs);position:relative;overflow:hidden;}
.qt-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue-grad);opacity:0;transition:opacity var(--t);}
.qt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--blue-light);}
.qt-card:hover::before{opacity:1;}
.item-row{display:grid;grid-template-columns:minmax(260px,1fr) 72px 120px 110px 36px;gap:8px;align-items:center;background:var(--card-alt);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.item-num{width:22px;height:22px;border-radius:50%;background:var(--blue-pale);color:var(--blue);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dim-grid{display:grid;grid-template-columns:repeat(3,minmax(58px,1fr)) 78px;gap:5px;}
.dim-grid .form-input{padding:6px 8px;font-size:12px;}
.dim-grid select.form-input{padding:6px 6px;}
.total-panel{background:linear-gradient(135deg,#f0f7ff,#e8f2ff);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 20px;}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;}
.total-final{font-size:22px;font-weight:700;color:var(--blue);display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px;border-top:2px solid var(--blue-pale);margin-top:4px;}
.qt-report-header{background:var(--blue-grad);border-radius:var(--radius-sm) var(--radius-sm) 0 0;padding:20px 24px;color:#fff;margin:-30px -30px 20px;}
.tab-btn{padding:7px 18px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text2);transition:all var(--t);font-family:var(--font);}
.tab-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-pale);}
.tab-btn.active{background:var(--blue-grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-sm);}
.saving-overlay{position:fixed;inset:0;background:rgba(30,58,95,.5);z-index:1000;display:none;align-items:center;justify-content:center;font-family:'Prompt',sans-serif;color:#fff;font-size:18px;font-weight:600;gap:14px;}
.saving-overlay.show{display:flex;}
@keyframes spin2{to{transform:rotate(360deg)}}
@media(max-width:760px){.item-row{grid-template-columns:1fr;}.dim-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
</style>
</head>
<body>
<div class="saving-overlay" id="savingOverlay">
  <div style="width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin2 1s linear infinite;"></div>
  <span>กำลังบันทึก... กรุณารอสักครู่</span>
</div>

<div class="app-layout">
  <div id="nav-root"></div>
  <div class="main-content">
    <div class="topbar">
      <div class="flex-center gap-12">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="page-title">📋 ใบเสนอราคา</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="loadQuotations()">🔄 โหลดใหม่</button>
        <button class="btn btn-primary" onclick="openCreate()">+ สร้างใบใหม่</button>
      </div>
    </div>
    <div class="page-body">
      <div class="grid grid-4 mb-24">
        <div class="card stat-card blue"><div class="stat-icon">📋</div><div class="stat-value" id="st-all">0</div><div class="stat-label">ทั้งหมด</div></div>
        <div class="card stat-card" style="border-top:3px solid #64748b"><div class="stat-icon" style="background:#f1f5f9;color:#64748b">📁</div><div class="stat-value" id="st-draft">0</div><div class="stat-label">Draft</div></div>
        <div class="card stat-card teal"><div class="stat-icon">⚡</div><div class="stat-value" id="st-active">0</div><div class="stat-label">Active</div></div>
        <div class="card stat-card green"><div class="stat-icon">✅</div><div class="stat-value" id="st-closed">0</div><div class="stat-label">Closed</div></div>
      </div>
      <div class="card mb-20" style="padding:16px 20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="tab-btn active" data-filter="all">ทั้งหมด</button>
            <button class="tab-btn" data-filter="Draft">📁 Draft</button>
            <button class="tab-btn" data-filter="Active">⚡ Active</button>
            <button class="tab-btn" data-filter="Confirmed">✅ Confirmed</button>
            <button class="tab-btn" data-filter="Closed">🏁 Closed</button>
          </div>
          <div style="position:relative;">
            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);">🔍</span>
            <input class="form-input" id="searchInput" placeholder="ค้นหาลูกค้า / เลขใบ..." style="padding-left:36px;min-width:220px;">
          </div>
        </div>
      </div>
      <div id="qtGrid" class="qt-grid"></div>
    </div>
  </div>
</div>

<!-- CREATE MODAL -->
<div class="modal-overlay" id="qtModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">📋 สร้างใบเสนอราคาใหม่</div>
      <button class="modal-close" onclick="QuoteFlow.closeModal('qtModal')">✕</button>
    </div>
    <input type="hidden" id="editId">
    <div style="background:var(--blue-pale);border-radius:var(--radius-sm);padding:16px;margin-bottom:20px;">
      <div class="form-row form-row-2">
        <div class="form-group"><label class="form-label">👤 ชื่อลูกค้า *</label><input class="form-input" id="customerName" placeholder="ชื่อบริษัท / ชื่อลูกค้า"></div>
        <div class="form-group"><label class="form-label">📍 ที่อยู่ / เงื่อนไขชำระ</label><input class="form-input" id="qtNote" placeholder="ที่อยู่ หรือ เงื่อนไขการชำระเงิน"></div>
      </div>
    </div>
    <div class="flex-between mb-12">
      <div class="card-title" style="margin:0">🛒 รายการสินค้า</div>
      <button class="btn btn-ghost btn-sm" onclick="addItemRow()">+ เพิ่มรายการ</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 72px 120px 110px 36px;gap:8px;padding:0 12px 6px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;">
      <span>รายการสินค้า / บริการ</span><span style="text-align:center">จำนวน</span><span style="text-align:center">ราคา/หน่วย</span><span style="text-align:right">รวม</span><span></span>
    </div>
    <div id="itemsList"></div>
    <hr class="divider">
    <div style="display:flex;justify-content:flex-end;">
      <div class="total-panel" style="min-width:280px;">
        <div class="total-row"><span class="text-sm text-muted">ยอดก่อนภาษี</span><span id="disp-sub" class="fw-bold">฿0.00</span></div>
        <div class="total-row">
          <label class="flex-center gap-8" style="cursor:pointer;font-size:13px;color:var(--text2);">
            <input type="checkbox" id="vatCheck" onchange="recalc()" style="accent-color:var(--blue);width:15px;height:15px;"> ภาษีมูลค่าเพิ่ม 7%
          </label>
          <span id="disp-vat" class="text-muted text-sm">฿0.00</span>
        </div>
        <div class="total-final"><span>ยอดรวมทั้งสิ้น</span><span id="disp-total">฿0.00</span></div>
      </div>
    </div>
    <div class="flex-center gap-10 mt-24" style="justify-content:flex-end;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="QuoteFlow.closeModal('qtModal')">ยกเลิก</button>
      <button class="btn btn-ghost" id="btnDraft" onclick="saveQuotation('Draft')">💾 บันทึก Draft</button>
      <button class="btn btn-primary" id="btnConfirm" onclick="saveQuotation('Confirmed')">✅ ยืนยัน</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-overlay" id="viewModal">
  <div class="modal modal-lg">
    <div id="viewContent"></div>
    <div class="flex-center gap-8 mt-20" style="flex-wrap:wrap;" id="viewActions"></div>
  </div>
</div>

<!-- ACTIVATE MODAL -->
<div class="modal-overlay" id="activateModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">⚡ Activate Quotation</div>
      <button class="modal-close" onclick="QuoteFlow.closeModal('activateModal')">✕</button>
    </div>
    <div style="background:var(--blue-pale);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;">
      <div class="text-sm text-muted">ยอดรวมใบเสนอราคา</div>
      <div style="font-size:22px;font-weight:700;color:var(--blue);" id="actTotal">฿0.00</div>
    </div>
    <div class="form-row form-row-2 mb-12">
      <div class="form-group">
        <label class="form-label">% มัดจำ *</label>
        <input type="number" class="form-input" id="actDepositPct" min="0" max="100" step="0.01" value="40" oninput="updateActivateDeposit()">
      </div>
      <div class="form-group">
        <label class="form-label">ยอดมัดจำ (บาท)</label>
        <input type="number" class="form-input" id="actDepositAmount" min="0" step="0.01" oninput="updateActivateBalance()">
      </div>
    </div>
    <div class="text-sm text-muted mb-20" id="actBalancePreview">คงค้าง ฿0.00</div>
    <div class="flex-center gap-10" style="justify-content:flex-end;">
      <button class="btn btn-outline" onclick="QuoteFlow.closeModal('activateModal')">ยกเลิก</button>
      <button class="btn btn-green" onclick="confirmActivate()">✅ Activate</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/nav.js"></script>
<script>
QuoteFlow.requireAuth();
injectSidebar('quotation');

var quotations=[], currentQt=null, filterStatus='all', itemCount=0, _saving=false;

function addItemRow(item){
  item=item||{};
  var dim=item.dimensions||{};
  var unit=(dim.unit||'CM').toUpperCase();
  var id=itemCount++, num=document.querySelectorAll('#itemsList .item-row').length+1;
  var row=document.createElement('div');
  row.className='item-row'; row.id='item-'+id; row.setAttribute('data-row-id', id);
  row.innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;">'+
      '<span class="item-num">'+num+'</span>'+
      '<div style="flex:1;display:flex;flex-direction:column;gap:4px;">'+
        '<input class="form-input" placeholder="ชื่อสินค้า / บริการ" data-field="name" value="'+(item.name||'')+'" style="padding:8px 10px;">'+
        '<div class="dim-grid">'+
          '<input class="form-input" type="number" min="0" step="0.01" placeholder="กว้าง" data-field="width" value="'+(dim.width||'')+'">'+
          '<input class="form-input" type="number" min="0" step="0.01" placeholder="ยาว" data-field="length" value="'+(dim.length||'')+'">'+
          '<input class="form-input" type="number" min="0" step="0.01" placeholder="สูง" data-field="height" value="'+(dim.height||'')+'">'+
          '<select class="form-input" data-field="unit">'+
            '<option value="CM" '+(unit==='CM'?'selected':'')+'>CM</option>'+
            '<option value="M" '+(unit==='M'?'selected':'')+'>M</option>'+
          '</select>'+
        '</div>'+
        '<label style="cursor:pointer;font-size:11px;color:var(--text3);">📷 แนบรูป<input type="file" accept="image/*" style="display:none;" onchange="previewImg(this,'+id+')"></label>'+
        '<img id="img-'+id+'" style="display:'+(item.img&&item.img.length>5?'block':'none')+';width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--border);" src="'+(item.img||'')+'">'+
      '</div>'+
    '</div>'+
    '<input class="form-input" type="number" min="1" placeholder="1" data-field="qty" value="'+(item.qty||1)+'" oninput="recalc()" style="text-align:center;padding:8px 6px;">'+
    '<input class="form-input" type="number" min="0" placeholder="0.00" data-field="price" value="'+(item.price||'')+'" oninput="recalc()" style="text-align:right;padding:8px 10px;">'+
    '<div data-amount style="text-align:right;font-weight:700;color:var(--blue);font-size:13px;">฿0.00</div>'+
    '<button class="btn btn-danger btn-icon btn-sm" onclick="removeItem(\'item-'+id+'\')" title="ลบ">✕</button>';
  document.getElementById('itemsList').appendChild(row);
  row.querySelector('[data-field="name"]').addEventListener('input',recalc);
  recalc();
}

function removeItem(id){var el=document.getElementById(id);if(el)el.remove();recalc();document.querySelectorAll('#itemsList .item-num').forEach(function(e,i){e.textContent=i+1;});}
function previewImg(input,id){
  var file=input.files[0];if(!file)return;
  // resize ก่อนบันทึก เพื่อให้ขนาดไม่ใหญ่เกินไป
  var reader=new FileReader();
  reader.onload=function(e){
    var origSrc=e.target.result;
    // resize to max 400px via canvas
    var img2=new Image();
    img2.onload=function(){
      var maxW=400,maxH=400,w=img2.width,h=img2.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img2,0,0,w,h);
      var resized=canvas.toDataURL('image/jpeg',0.75);
      var el=document.getElementById('img-'+id);
      el.src=resized;el.style.display='block';
      // เก็บ base64 ไว้ใน data attribute เพื่อดึงตอน export PDF
      el.setAttribute('data-b64',resized);
    };
    img2.src=origSrc;
  };
  reader.readAsDataURL(file);
}

function getItems(){
  return Array.from(document.querySelectorAll('#itemsList .item-row')).map(function(row){
    var imgEl=row.querySelector('img');
    // ดึง base64 จาก data-b64 (resize แล้ว) หรือ src ถ้าไม่มี
    var imgSrc='';
    if(imgEl&&imgEl.style.display!=='none'){
      imgSrc=imgEl.getAttribute('data-b64')||imgEl.src||'';
      // ถ้าเป็น URL ปกติ (ไม่ใช่ base64) ไม่เอา
      if(imgSrc&&!imgSrc.startsWith('data:'))imgSrc='';
    }
    return{
      name:(row.querySelector('[data-field="name"]')||{}).value||'',
      qty:Number((row.querySelector('[data-field="qty"]')||{}).value||1),
      price:Number((row.querySelector('[data-field="price"]')||{}).value||0),
      dimensions:{
        width:(row.querySelector('[data-field="width"]')||{}).value||'',
        length:(row.querySelector('[data-field="length"]')||{}).value||'',
        height:(row.querySelector('[data-field="height"]')||{}).value||'',
        unit:(row.querySelector('[data-field="unit"]')||{}).value||'CM'
      },
      img:imgSrc
    };
  });
}

function recalc(){
  var items=getItems(),sub=0;
  document.querySelectorAll('#itemsList .item-row').forEach(function(row,i){
    var it=items[i]||{qty:0,price:0};
    var amt=it.qty*it.price;
    sub+=amt;
    var el=row.querySelector('[data-amount]');
    if(el)el.textContent=QuoteFlow.baht(amt);
  });
  var vat=document.getElementById('vatCheck').checked?sub*0.07:0;
  document.getElementById('disp-sub').textContent=QuoteFlow.baht(sub);
  document.getElementById('disp-vat').textContent=QuoteFlow.baht(vat);
  document.getElementById('disp-total').textContent=QuoteFlow.baht(sub+vat);
}

function saveQuotation(status){
  if(_saving)return;
  var items=getItems().filter(function(i){return i.name.trim();});
  var cn=document.getElementById('customerName').value.trim();
  if(!cn){QuoteFlow.toast('กรุณาใส่ชื่อลูกค้า','error');return;}
  if(!items.length){QuoteFlow.toast('กรุณาเพิ่มรายการอย่างน้อย 1 รายการ','error');return;}
  var sub=items.reduce(function(s,i){return s+i.qty*i.price;},0);
  var vat=document.getElementById('vatCheck').checked?sub*0.07:0;
  var editId=document.getElementById('editId').value;
  var qtId=editId||QuoteFlow.makeId('QT');
  // ✅ เก็บ images ไว้ใน localStorage แยกต่างหาก
  var imgStore={};
  items.forEach(function(it,idx){if(it.img&&it.img.length>500)imgStore[idx]=it.img;});
  var data={id:qtId,customerName:cn,note:document.getElementById('qtNote').value.trim(),items:items,subtotal:sub,vat:vat,total:sub+vat,status:status};
  _saving=true;
  document.getElementById('savingOverlay').classList.add('show');
  document.getElementById('btnDraft').disabled=true;
  document.getElementById('btnConfirm').disabled=true;
  QuoteFlow.api(editId?'updateQuotation':'createQuotation',data).then(function(res){
    _saving=false;
    document.getElementById('savingOverlay').classList.remove('show');
    document.getElementById('btnDraft').disabled=false;
    document.getElementById('btnConfirm').disabled=false;
    if(res.success){
      QuoteFlow.toast(editId?'อัปเดตสำเร็จ! ✅':'สร้างใบสำเร็จ! ✅','success');
      // ✅ บันทึกรูปลง localStorage ด้วย QT ID
      if(Object.keys(imgStore).length > 0){
        try{ localStorage.setItem('qf_img_'+qtId, JSON.stringify(imgStore)); }catch(e){}
      }
      QuoteFlow.closeModal('qtModal'); resetForm();
      loadQuotations();
    } else {
      QuoteFlow.toast('เกิดข้อผิดพลาด: '+(res.error||''),'error');
    }
  });
}

function openCreate(){resetForm();addItemRow();QuoteFlow.openModal('qtModal');}
function resetForm(){
  document.getElementById('editId').value='';document.getElementById('customerName').value='';
  document.getElementById('qtNote').value='';document.getElementById('vatCheck').checked=false;
  document.getElementById('itemsList').innerHTML='';
  document.getElementById('modalTitle').textContent='📋 สร้างใบเสนอราคาใหม่';
  itemCount=0;recalc();
}

function loadQuotations(){
  document.getElementById('qtGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text3);">⏳ กำลังโหลด...</div>';
  QuoteFlow.api('getQuotations').then(function(res){
    if(res.success){quotations=res.data||[];updateStats();renderGrid();}
    else document.getElementById('qtGrid').innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><p>โหลดข้อมูลไม่ได้ กรุณา Refresh</p></div>';
  });
}

function updateStats(){
  document.getElementById('st-all').textContent   =quotations.length;
  document.getElementById('st-draft').textContent =quotations.filter(function(q){return q.status==='Draft';}).length;
  document.getElementById('st-active').textContent=quotations.filter(function(q){return q.status==='Active';}).length;
  document.getElementById('st-closed').textContent=quotations.filter(function(q){return q.status==='Closed';}).length;
}

function renderGrid(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var list=quotations.filter(function(q){
    var ms=filterStatus==='all'||q.status===filterStatus;
    var mq=!search||(q.customerName||'').toLowerCase().indexOf(search)>=0||(q.id||'').toLowerCase().indexOf(search)>=0;
    return ms&&mq;
  }).sort(function(a,b){return(b.createdAt||'').localeCompare(a.createdAt||'');});
  var el=document.getElementById('qtGrid');
  if(!list.length){el.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📋</div><p>ยังไม่มีใบเสนอราคา<br><span class="text-xs">กดปุ่ม + สร้างใบใหม่</span></p></div>';return;}
  var sc={Draft:'#64748b',Active:'#0ea5e9',Confirmed:'#3b82f6',Closed:'#8b5cf6'};
  el.innerHTML=list.map(function(q){
    var pct=q.status==='Closed'?100:q.status==='Active'?60:q.status==='Confirmed'?40:20;
    return '<div class="qt-card" onclick="viewQt(\''+q.id+'\')">'+'<div class="flex-between mb-10"><span style="font-size:11px;font-weight:600;color:var(--text3);">'+(q.id||'')+'</span><span class="badge badge-'+(q.status||'draft').toLowerCase()+'">'+(q.status||'Draft')+'</span></div>'+'<div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px;">'+(q.customerName||'-')+'</div>'+'<div style="font-size:12px;color:var(--text3);margin-bottom:14px;">📅 '+QuoteFlow.fmtDate(q.createdAt)+'</div>'+'<div style="height:3px;background:var(--border2);border-radius:2px;margin-bottom:14px;"><div style="height:100%;width:'+pct+'%;background:'+(sc[q.status]||'#94a3b8')+';border-radius:2px;"></div></div>'+'<div class="flex-between"><span style="font-size:12px;color:var(--text3);">'+(Array.isArray(q.items)?q.items.length:0)+' รายการ</span><span style="font-size:20px;font-weight:700;color:var(--blue);">'+QuoteFlow.baht(q.total)+'</span></div></div>';
  }).join('');
}

function viewQt(id){
  currentQt=null; for(var i=0;i<quotations.length;i++){if(quotations[i].id===id){currentQt=quotations[i];break;}} if(!currentQt)return;
  // ✅ ดึงรูปจาก localStorage แล้ว merge เข้า items
  try{
    var stored=localStorage.getItem('qf_img_'+id);
    if(stored){
      var imgStore=JSON.parse(stored);
      var arr=Array.isArray(currentQt.items)?currentQt.items.slice():[];
      Object.keys(imgStore).forEach(function(k){if(arr[k])arr[k]=Object.assign({},arr[k],{img:imgStore[k]});});
      currentQt=Object.assign({},currentQt,{items:arr});
    }
  }catch(e){}
  var q=currentQt, items=Array.isArray(q.items)?q.items:[];
  document.getElementById('viewContent').innerHTML=
    '<div class="qt-report-header"><div class="flex-between" style="flex-wrap:wrap;gap:12px;"><div><div style="font-size:12px;opacity:.75;margin-bottom:4px;">ใบเสนอราคา / QUOTATION</div><div style="font-size:22px;font-weight:700;">'+(q.customerName||'-')+'</div></div><div style="text-align:right;"><div style="font-size:18px;font-weight:700;">'+(q.id||'')+'</div><div style="font-size:12px;opacity:.75;margin-top:3px;">📅 '+QuoteFlow.fmtDate(q.createdAt)+'</div><span class="badge badge-'+(q.status||'draft').toLowerCase()+'" style="margin-top:8px;">'+(q.status||'Draft')+'</span></div></div></div>'+
    '<div class="table-wrap mb-16"><table><thead><tr><th>#</th><th>รายการ</th><th style="text-align:center">จำนวน</th><th style="text-align:right">ราคา/หน่วย</th><th style="text-align:right">รวม</th></tr></thead><tbody>'+
    (items.length?items.map(function(it,i){var dim=QuoteFlow.itemDimensionText(it);return'<tr><td style="color:var(--text3);font-size:12px;">'+(i+1)+'</td><td style="font-weight:500;">'+(it.name||'-')+(dim?'<div class="text-xs text-muted mt-4">ขนาด: '+dim+'</div>':'')+'</td><td style="text-align:center;">'+(it.qty||1)+'</td><td style="text-align:right;">'+QuoteFlow.baht(it.price)+'</td><td style="text-align:right;font-weight:600;color:var(--blue);">'+QuoteFlow.baht((it.qty||1)*(it.price||0))+'</td></tr>';}).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:20px;">ไม่มีรายการ</td></tr>')+
    '</tbody></table></div>'+
    '<div style="display:flex;justify-content:flex-end;"><div style="background:linear-gradient(135deg,#f0f7ff,#e8f2ff);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;min-width:260px;">'+
    '<div class="total-row"><span class="text-sm text-muted">ยอดก่อนภาษี</span><span class="fw-bold">'+QuoteFlow.baht(q.subtotal)+'</span></div>'+
    '<div class="total-row"><span class="text-sm text-muted">ภาษีมูลค่าเพิ่ม 7%</span><span class="text-muted">'+QuoteFlow.baht(q.vat)+'</span></div>'+
    '<div class="total-final"><span>ยอดรวมทั้งสิ้น</span><span>'+QuoteFlow.baht(q.total)+'</span></div></div></div>'+
    (q.note?'<div style="margin-top:16px;padding:10px 14px;background:var(--blue-pale);border-radius:8px;font-size:13px;color:var(--blue-dark);">📝 '+q.note+'</div>':'');

  document.getElementById('viewActions').innerHTML=
    '<button class="btn btn-primary" onclick="QuoteFlow.exportQuotationPDF(currentQt)">📄 Export PDF</button>'+
    '<button class="btn btn-outline" onclick="QuoteFlow.shareQuotation(currentQt)">🔗 Share</button>'+
    (q.status!=='Active'&&q.status!=='Closed'?'<button class="btn btn-green" onclick="openActivateModal()">⚡ Activate</button>':'')+
    '<button class="btn btn-ghost" onclick="doEdit()">✏️ แก้ไข</button>'+
    '<button class="btn btn-danger" onclick="doDelete(\''+q.id+'\')">🗑️ ลบ</button>'+
    '<button class="btn btn-outline" onclick="QuoteFlow.closeModal(\'viewModal\')">ปิด</button>';
  QuoteFlow.openModal('viewModal');
}

function openActivateModal(){
  if(!currentQt)return;
  document.getElementById('actTotal').textContent=QuoteFlow.baht(currentQt.total);
  document.getElementById('actDepositPct').value=currentQt.depositPct||40;
  updateActivateDeposit();
  QuoteFlow.openModal('activateModal');
}
function updateActivateDeposit(){
  var total=Number((currentQt||{}).total)||0;
  var pct=Number(document.getElementById('actDepositPct').value)||0;
  var amount=Math.round(total*pct/100);
  document.getElementById('actDepositAmount').value=amount;
  updateActivateBalance();
}
function updateActivateBalance(){
  var total=Number((currentQt||{}).total)||0;
  var amount=Number(document.getElementById('actDepositAmount').value)||0;
  document.getElementById('actBalancePreview').textContent='คงค้าง '+QuoteFlow.baht(Math.max(0,total-amount));
}
function confirmActivate(){
  if(!currentQt)return;
  var depositPct=Number(document.getElementById('actDepositPct').value)||0;
  var depositAmount=Number(document.getElementById('actDepositAmount').value)||0;
  QuoteFlow.api('activateOrder',{quotationId:currentQt.id,customerName:currentQt.customerName,total:currentQt.total,depositPct:depositPct,depositAmount:depositAmount}).then(function(r){
    if(r.success){QuoteFlow.toast('Activate สำเร็จ! ✅','success');QuoteFlow.closeModal('activateModal');QuoteFlow.closeModal('viewModal');loadQuotations();}
  });
}
function doEdit(){
  QuoteFlow.closeModal('viewModal');resetForm();
  document.getElementById('editId').value=currentQt.id;
  document.getElementById('customerName').value=currentQt.customerName||'';
  document.getElementById('qtNote').value=currentQt.note||'';
  document.getElementById('modalTitle').textContent='✏️ แก้ไขใบเสนอราคา';
  (Array.isArray(currentQt.items)?currentQt.items:[]).forEach(function(i){addItemRow(i);});
  if(currentQt.vat>0)document.getElementById('vatCheck').checked=true;
  recalc();QuoteFlow.openModal('qtModal');
}
function doDelete(id){
  if(!confirm('ยืนยันการลบ?'))return;
  QuoteFlow.api('deleteQuotation',{id:id}).then(function(r){if(r.success){QuoteFlow.toast('ลบสำเร็จ','warn');QuoteFlow.closeModal('viewModal');loadQuotations();}});
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');filterStatus=btn.dataset.filter;renderGrid();});
});
document.getElementById('searchInput').addEventListener('input',renderGrid);
resetForm();addItemRow();loadQuotations();
</script>
</body>
</html>
